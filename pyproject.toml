[project]
name = "maestro"
version = "0.2.0"
description = "Mechanism-Aware Evidence-driven Scientific Agent for Therapeutic Reasoning and Optimization."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
maestro = "agent.cli:main"

[project.optional-dependencies]
test = ["pytest==9.1.1", "numpy"]
research = ["numpy", "scipy", "pandas", "h5py", "scikit-learn", "torch", "rdkit"]

[tool.pytest.ini_options]
testpaths = [
    "tests/test_handoff.py",
    "tests/test_restart_contract.py",
    "tests/test_research_validation.py",
    "tests/test_case_lifecycle.py",
    "tests/test_case_control_loop.py",
    "tests/test_case_decision_loop.py",
    "tests/test_orchestrator_execution_authority.py",
    "tests/test_orchestrator_repair_execution.py",
    "tests/test_budgeted_orchestration.py",
    "tests/test_agent_world_model_integration.py",
    "tests/test_agent_module_contracts.py",
    "tests/test_condition_sources.py",
    "tests/test_tool_catalog_efficiency.py",
    "tests/test_dataset_hash_consolidation.py",
    "tests/test_discriminating_acquisition.py",
    "tests/test_integrated_research_contract.py",
    "tests/test_model_runtime_defects.py",
    "tests/test_runtime_promotion.py",
    "tests/test_memory_scope_and_retraction.py",
    "tests/test_context_evidence_cards.py",
    "tests/test_evidence_audit_prerequisites.py",
    "tests/test_feedback_promotion.py",
    "tests/test_virtual_cell_contract.py",
    "tests/test_virtual_cell_panel.py",
    "tests/test_prediction_reliability.py",
    "tests/test_selection.py",
    "tests/test_acquisition.py",
    "tests/test_outcome_decision.py",
    "tests/test_state_evidence_followup.py",
    "tests/test_certification.py",
    "tests/test_combination_world.py",
]
python_files = ["test_*.py"]
addopts = "-q"
pythonpath = ["src"]
markers = [
    "core: asset-free execution, prediction and evidence contracts (default testpaths)",
    "regression: explicit small distributed frozen-replay package",
    "research: remaining opt-in studies, tools and optional-asset contracts",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "agent", "maestro", "virtual_cell", "tools", "tools.case_memory",
    "tools.data", "tools.evidence", "tools.prediction", "tools.evaluation", "tools.datasets",
]

[tool.setuptools.package-dir]
agent = "src/agent"
maestro = "src/maestro"
virtual_cell = "src/virtual_cell"
tools = "tools"

[tool.setuptools.package-data]
tools = ["registry.yaml", "*/*.json"]
"tools.datasets" = ["sources.json", "candidates.json"]

[tool.maestro.test_scopes]
# New tests in tests/ or maintained ASTRA must be assigned explicitly.
regression = [
    "research/astra/test_reproducibility_audit.py",
    "research/case_memory_integration/test_external_evaluation.py",
]
research = [
    "research/astra/boundary_acquisition_20261007/test_boundary.py",
    "research/astra/decision_opportunity_20261007/test_direction.py",
