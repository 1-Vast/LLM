[project]
name = "maestro"
version = "0.2.0"
description = "Mechanism-Aware Evidence-driven Scientific Agent for Therapeutic Reasoning and Optimization."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
maestro = "agent.cli:main"

[project.optional-dependencies]
test = ["pytest==9.1.1", "numpy"]
research = ["numpy", "scipy", "pandas", "h5py", "scikit-learn", "torch", "rdkit"]

[tool.pytest.ini_options]
testpaths = [
    "tests/test_observation_audit.py",
    "tests/test_research_inventory.py",
    "tests/test_handoff.py",
    "tests/test_restart_contract.py",
    "tests/test_research_validation.py",
    "tests/test_case_lifecycle.py",
    "tests/test_case_control_loop.py",
    "tests/test_case_decision_loop.py",
    "tests/test_orchestrator_execution_authority.py",
    "tests/test_orchestrator_repair_execution.py",
    "tests/test_budgeted_orchestration.py",
    "tests/test_agent_world_model_integration.py",
    "tests/test_agent_module_contracts.py",
    "tests/test_condition_sources.py",
    "tests/test_case_memory_forecast_modes.py",
    "tests/test_case_memory_integration.py",
    "tests/test_case_memory_orchestrator.py",
    "tests/test_case_memory_scientific_boundaries.py",
    "tests/test_case_memory_state_visibility.py",
    "tests/test_structured_tools.py",
    "tests/test_state_adapter.py",
    "tests/test_state_adapter_intervals.py",
    "tests/test_tool_receipts.py",
    "tests/test_evaluation_integrity.py",
    "tests/test_typed_decision_critic.py",
    "tests/test_model_runtime_defects.py",
    "tests/test_tool_catalog_efficiency.py",
    "tests/test_discriminating_acquisition.py",
    "tests/test_integrated_research_contract.py",
    "tests/test_runtime_promotion.py",
    "tests/test_memory_scope_and_retraction.py",
    "tests/test_context_evidence_cards.py",
    "tests/test_evidence_audit_prerequisites.py",
    "tests/test_feedback_promotion.py",
    "tests/test_virtual_cell_contract.py",
    "tests/test_virtual_cell_panel.py",
    "tests/test_prediction_reliability.py",
    "tests/test_selection.py",
    "tests/test_acquisition.py",
    "tests/test_outcome_decision.py",
    "tests/test_certification.py",
    "tests/test_combination_world.py",
    "tests/test_world_model_value.py",
    "tests/test_tahoe_phenotypes.py",
    "tests/test_context_transfer.py",
    "tests/test_repository_shape.py",
]
python_files = ["test_*.py"]
addopts = "-q"
pythonpath = ["src"]
markers = [
    "core: asset-free execution, prediction and evidence contracts (default testpaths)",
    "regression: explicit small distributed frozen-replay package",
    "research: explicitly registered research studies",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "agent", "maestro", "virtual_cell", "tools", "tools.case_memory",
    "tools.analysis", "tools.prediction", "tools.evaluation", "tools.datasets",
]

[tool.setuptools.package-dir]
agent = "src/agent"
maestro = "src/maestro"
virtual_cell = "src/virtual_cell"
tools = "tools"

[tool.setuptools.package-data]
tools = ["registry.yaml", "*/*.json"]

[tool.maestro.test_scopes]
# New tests in tests/ or maintained ASTRA must be assigned explicitly.
regression = []
research = [
    "research/astra/phenotype_anchor_20261010/test_phenotype_anchor.py",
    "research/astra/phenotype_anchor_20261010/test_promotion_parity.py",
    "research/decision_value/axis_extension_20261010/test_extension.py",
    "research/decision_value/axis_recovery_20261010/design/test_diagnosis_verify.py",
    "research/decision_value/axis_recovery_20261010/design/test_calibration_v2_verify.py",
    "research/decision_value/axis_recovery_20261010/design/test_calibration_verify.py",
    "research/decision_value/axis_recovery_20261010/design/test_named_verify.py",
    "research/decision_value/observation_reliability/test_reliability.py",
    "research/decision_value/pairwise_v3/test_v3.py",
    "research/decision_value/pairwise_20261009/test_pairwise.py",
    "research/map_module_replacement_20261009/agent_trial/test_offline_guard.py",
    "research/map_module_replacement_20261009/agent_trial/test_hard_trial.py",
    "research/map_module_replacement_20261009/test_scarcity.py",
    "research/map_module_replacement_20261009/test_replacement.py",
    "research/map_module_replacement_20261009/agent_trial/test_source_contract.py",
    "research/knowledge_layer_validation_20261009/test_benchmark.py",
    "research/decision_value/test_utility.py",
    "research/astra/state_feedback_repair_20261009/test_posterior.py",
    "research/astra/state_readout_repair_20261009/test_readout.py",
]
# These suites require source or data fixtures excluded from the release checkout.
archive = [
    "tests/test_combination_screens.py",
    "tests/test_dataset_hash_consolidation.py",
    "tests/test_evaluation_isolation.py",
    "tests/test_evaluation_protocol.py",
]
