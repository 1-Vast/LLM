[project]
name = "maestro"
version = "0.2.0"
description = "Mechanism-Aware Evidence-driven Scientific Agent for Therapeutic Reasoning and Optimization."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
maestro = "agent.cli:main"
maestro-evaluate = "evaluation.cli:main"
maestro-screen-cases = "evaluation.screening_cli:main"
maestro-build-cases = "evaluation.build_cli:main"
maestro-e0-dir = "evaluation.e0_dir:main"

[project.optional-dependencies]
test = ["pytest==9.1.1"]
research = ["numpy", "scipy", "pandas", "h5py", "scikit-learn", "torch", "rdkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
