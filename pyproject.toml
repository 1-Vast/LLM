[project]
name = "maestro"
version = "0.2.0"
description = "Mechanism-Aware Evidence-driven Scientific Agent for Therapeutic Reasoning and Optimization."
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.scripts]
maestro = "agent.cli:main"

[project.optional-dependencies]
test = ["pytest==9.1.1"]
preparation = ["scipy", "pandas", "h5py", "scikit-learn", "openpyxl", "xlrd", "python-docx"]
research = ["scipy", "pandas", "h5py", "scikit-learn", "torch", "rdkit", "anndata", "matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "tmp/pytest_cache"
python_files = ["test_*.py"]
addopts = "-q"
pythonpath = ["src"]
markers = [
    "core: default software contracts discovered under tests/",
    "regression: explicit small distributed frozen-replay package",
    "research: explicitly registered research studies",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "agent", "maestro", "virtual_cell", "tools", "tools.case_memory",
    "tools.analysis", "tools.prediction", "tools.evaluation", "tools.datasets",
]

[tool.setuptools.package-dir]
agent = "src/agent"
maestro = "src/maestro"
virtual_cell = "src/virtual_cell"
tools = "tools"

[tool.setuptools.package-data]
tools = ["registry.yaml", "*/*.json"]

[tool.maestro.test_scopes]
# Asset-dependent suites are explicit; all other tests under tests/ are core.
regression = []
# Explicit asset-dependent suites are retained; missing assets are blockers.
research = [
    "tests/test_combination_screens.py",
    "tests/test_evaluation_isolation.py",
    "tests/test_evaluation_protocol.py",
]
