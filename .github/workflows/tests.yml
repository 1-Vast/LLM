# Asset-free software tests. A green run means code and contracts execute; it is not
# research verification (each study's verifier) and not a scientific verdict.
# This job downloads no research dataset and runs no frozen or sealed study.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  software-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no research assets)
        # Research study contract tests import these scientific packages during collection.
        run: python -m pip install -e ".[test]" pandas h5py scipy scikit-learn
      - name: Software tests
        env:
          MAESTRO_LOG_DIRECTORY: tmp
        run: python -m pytest -q
      - name: Unconfigured research preflight must refuse
        shell: bash
        run: |
          set +e
          out="$(python -m tools.research_validation --verify)"
          code=$?
          set -e
          printf '%s\n' "$out"
          test "$code" -eq 2
          printf '%s\n' "$out" | head -n 1 | grep -qx "BLOCKED/ASSET_MISSING"
