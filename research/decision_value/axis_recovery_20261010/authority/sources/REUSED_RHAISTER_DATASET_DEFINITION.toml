# Tahoe-100M drug screen — portable dataset definition.
# Data paths are relative to the dataset repo root (e.g. a downloaded HF
# snapshot). prepare_combined resolves them when RHAISTER_DATA_ROOT points at
# that root; definition files (this file, the gene list, split TOMLs) live under
# $RHAISTER_DATA_ROOT/definition.

[data]
pdex_path      = "pdex/all_plates_pdex.parquet"
cell_eval_dir  = "cell_eval"
cell_eval_glob = "plate_plate*.parquet"
control_expression_path = "zeroshot/control_expression.parquet"
cell_centroid_path      = "zeroshot/cell_line_centroids_dmso.parquet"
cell_centroid_hvg_path  = "zeroshot/cell_line_centroids_dmso_hvg.parquet"

[genes]
static_list = "static_2k_genes.json"

[splits]
default_config = "generalization_converted_cell_lines_3b.toml"
