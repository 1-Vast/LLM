version: 4
discovery:
  manifest_patterns: ["tools/*/manifest.json", "tools/*/*.manifest.json"]
  execution_contract: "run(parameters) returns a strict JSON object with schema_version=1.0 and a structured payload; observations, limitations and artifacts are display-only compatibility fields."
selection:
  controller: "agent.tool_runtime.ToolRouter"
  policy: "The single-step interface remains compatible. In select_and_execute_many, the LLM sees each structured receipt before choosing the next call; execution is bounded to 0-32 steps, repeated calls including declared defaults, and one shared finite budget. A declared tool cost of zero does not make LLM or token use free."
  boundary: "Reject unapproved paths, unregistered tools, unknown parameters or schemas, non-finite numbers, and unsupported types or tasks. Natural-language applicability remains a model judgment, not deterministic validation. Trusted entrypoints run in-process and are not a process sandbox."
tools:
  - id: condition_sources
    directory: analysis
    purpose: Resolve exact declared context, drug, dose and source identity in approved metadata; derived analysis, never an authenticated observation or calibration certificate.
  - id: data_profile
    directory: analysis
    purpose: Profile CSV, TSV, or JSON structure before task-specific analysis.
  - id: column_summary
    directory: analysis
    purpose: Produce descriptive statistics for one explicitly named numeric column.
  - id: table_filter
    directory: analysis
    purpose: Apply one declarative, bounded table filter without arbitrary expressions.
  - id: evidence_bundle_optimize
    directory: analysis
    purpose: Optimize declared evidence coverage under an explicit budget using the existing exact selector; do not invent measurements or utility.
  - id: multimodal_alignment
    directory: analysis
    purpose: Run alignment QC on explicitly paired modality records and return discrepancies for review; do not generate embeddings or activity predictions.
  - id: typed_decision_review
    directory: analysis
    purpose: Validate recorded Typed Jev judgments as advisory model predictions and preserve deterministic decision authority.
  - id: signature_retrieval
    directory: prediction
    purpose: Rank the vendor-annotated compound classes a measured 24 h SciPlex3-line signature resembles; a derived analysis, never a mechanism verdict.
  - id: case_memory
    directory: case_memory
    purpose: Retrieve precedent scientific episodes with per-case reasons and adaptation requirements, and return hypothesis-conditional forecasts as planning-only model predictions; disabled by default behind the case-memory feature flag.
  - id: virtual_cell_query
    directory: prediction
    purpose: Check applicability and endpoint support before inference; return a planning-only prediction or named refusal, never measured evidence.
